<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Math Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧮 Kids Math Game</h1>
            <p class="subtitle">Test your math skills!</p>
        </header>

        <main>
            <!-- Game Container -->
            <div id="gameContainer" class="game-container">
                <div class="loading" id="loadingSpinner">
                    <p>Starting new game...</p>
                </div>

                <div id="questionCard" class="card hidden">
                    <div class="score-badge" id="scoreBadge">Question 1</div>
                    
                    <div class="question-text" id="questionText"></div>

                    <div class="options-container" id="optionsContainer"></div>

                    <div class="hint-section" id="hintSection" style="display: none;">
                        <button class="hint-btn" id="hintBtn" onclick="getHint()">💡 Get Hint</button>
                        <div class="hint-text" id="hintText"></div>
                    </div>
                </div>

                <div id="resultCard" class="card result-card hidden">
                    <div class="result-icon" id="resultIcon"></div>
                    <div class="result-text" id="resultText"></div>
                    <div class="result-details" id="resultDetails"></div>
                    <button class="btn btn-primary" onclick="startNewGame()">Play Again</button>
                </div>

                <div id="errorCard" class="card error-card hidden">
                    <h2>⚠️ Error</h2>
                    <p id="errorText"></p>
                    <button class="btn btn-primary" onclick="startNewGame()">Try Again</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Made with ❤️ for learning math</p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
